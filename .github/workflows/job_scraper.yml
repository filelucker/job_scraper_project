name: Automated Job Scraper & Auto-Apply Pipeline

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Tectonic LaTeX Compiler
        uses: wtfjoke/setup-tectonic@v4

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium Browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Execute Pipeline
        env:
          # Telegram Routing
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Google Sheets Routing
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME || 'Job Scraper Results' }}
          GOOGLE_WORKSHEET_NAME: ${{ secrets.GOOGLE_WORKSHEET_NAME || 'Jobs' }}

          # Auto-Apply & AI Tailoring
          AUTO_APPLY_ENABLED: ${{ secrets.AUTO_APPLY_ENABLED || 'true' }}
          AUTO_APPLY_MODE: ${{ secrets.AUTO_APPLY_MODE || 'auto' }}
          DRY_RUN: ${{ secrets.DRY_RUN || 'false' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Job Board API Integrations
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_LINKEDIN_ACTOR: ${{ secrets.APIFY_LINKEDIN_ACTOR }}
          APIFY_INDEED_ACTOR: ${{ secrets.APIFY_INDEED_ACTOR }}
          APIFY_LINKEDIN_LOCATION: ${{ secrets.APIFY_LINKEDIN_LOCATION }}
          APIFY_INDEED_LOCATION: ${{ secrets.APIFY_INDEED_LOCATION }}
          APIFY_INDEED_COUNTRY: ${{ secrets.APIFY_INDEED_COUNTRY }}
        run: python run_pipeline.py

      - name: Archive Generated Resumes & Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tailored-resumes
          path: output_resumes/
          retention-days: 14
