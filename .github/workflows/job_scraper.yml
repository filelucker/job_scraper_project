name: Daily Job Scraper Pipeline

on:
  schedule:
    # Run once daily at 08:00 UTC (8:00 AM UTC / 2:00 PM BST / 3:00 AM EST)
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Allows manual execution from the GitHub Actions tab at any time

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # caching pip dependencies to speed up runs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Job Scraper Pipeline
        env:
          # Set credentials from GitHub Repository Secrets
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
          GOOGLE_WORKSHEET_NAME: ${{ secrets.GOOGLE_WORKSHEET_NAME }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_LINKEDIN_ACTOR: ${{ secrets.APIFY_LINKEDIN_ACTOR }}
          APIFY_INDEED_ACTOR: ${{ secrets.APIFY_INDEED_ACTOR }}
          APIFY_LINKEDIN_LOCATION: ${{ secrets.APIFY_LINKEDIN_LOCATION }}
          APIFY_INDEED_LOCATION: ${{ secrets.APIFY_INDEED_LOCATION }}
          APIFY_INDEED_COUNTRY: ${{ secrets.APIFY_INDEED_COUNTRY }}
        run: python run_pipeline.py
